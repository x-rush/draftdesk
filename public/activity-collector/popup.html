<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>活动页采集</title><style>body{width:400px;font:14px/1.6 system-ui;padding:16px;color:#213c33}button{padding:10px;margin:6px 6px 6px 0}textarea,input{box-sizing:border-box;width:100%;margin:6px 0}textarea{height:150px}p{margin:8px 0}#candidates{max-height:135px;overflow:auto;white-space:pre-wrap;font-size:12px}</style><h2>官方活动采集</h2><p>在已登录的官方活动中心启动。自动扫描列表、读取可见详情；过期或日期不明的线索会在工作台标出，不进入 AI 分析。不会报名或发布。</p><label>目标关键词（逗号分隔）<input id="keywords" value="AI,AIGC,AI视频,Vibe Coding,vibecoding,AI编程,AI工具"></label><label>最多扫描页数 / 屏数<input id="maxPages" type="number" min="1" max="5" value="2"></label><button id="auto">自动采集当前平台</button><button id="downloadBatch" disabled>导出批量 JSON</button><p id="runStatus" role="status"></p><details><summary>手动读取单个活动</summary><button id="scan">扫描当前列表</button><button id="read">读取当前活动详情</button><p id="candidates"></p><p id="status" role="status"></p><label>标题<input id="title"></label><label>官方来源<input id="url" readonly></label><label>规则正文（请核对并删去个人信息）<textarea id="text" maxlength="12000"></textarea></label><button id="save" disabled>导出活动 JSON</button></details><p>返回 DraftDesk → 创作活动 → 导入批量文件并分析。登录状态留在本机浏览器，扩展不读取 Cookie。</p><script src="popup.js"></script></html>
