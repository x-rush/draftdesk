services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${DRAFTDESK_PORT:-5173}:3000"
    volumes:
      - ./data:/app/data
    environment:
      DRAFTDESK_DATA_DIR: /app/data
      DRAFTDESK_ALLOWED_HOSTS: host.docker.internal
      DRAFTDESK_AI_API_KEY: ${DRAFTDESK_AI_API_KEY:-}
      DRAFTDESK_AI_BASE_URL: ${DRAFTDESK_AI_BASE_URL:-}
      DRAFTDESK_AI_MODEL: ${DRAFTDESK_AI_MODEL:-ZHIPU/GLM-5.3-Flash}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      target: worker
    command: ["node", "--import", "tsx", "worker/index.ts"]
    stop_grace_period: 16m
    volumes:
      - ./data:/app/data
    environment:
      DRAFTDESK_DATA_DIR: /app/data
      DRAFTDESK_AI_API_KEY: ${DRAFTDESK_AI_API_KEY:-}
      DRAFTDESK_AI_BASE_URL: ${DRAFTDESK_AI_BASE_URL:-}
      DRAFTDESK_AI_MODEL: ${DRAFTDESK_AI_MODEL:-ZHIPU/GLM-5.3-Flash}
    restart: unless-stopped
