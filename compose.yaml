services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${DRAFTDESK_PORT:-5173}:3000"
    volumes:
      - ./data:/app/data
    environment:
      DRAFTDESK_DATA_DIR: /app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      target: worker
    command: ["npm", "run", "worker"]
    volumes:
      - ./data:/app/data
    environment:
      DRAFTDESK_DATA_DIR: /app/data
    restart: unless-stopped
