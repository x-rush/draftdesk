name: agents

# Agent 层：三个 agent 运行时。公共工具（dailyhot/searxng）在 draftdesk-tools
# 项目里，经共享网络 stack-net 以服务名访问（http://searxng:8080 等）。

services:
  openclaw:
    # 自建镜像：官方镜像 + Playwright/Chromium（见 docker/openclaw.Dockerfile）
    build:
      context: ./docker
      dockerfile: openclaw.Dockerfile
      args:
        BASE_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
        # 网络不稳时可在 agents/.env 里设 NPM_REGISTRY=https://registry.npmmirror.com
        # 或 PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.npmmirror.com/binaries/playwright
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        # 默认值必须写成官方地址：传空字符串会覆盖 Dockerfile 里的 ARG 默认值
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-https://cdn.playwright.dev}
    image: openclaw-pw:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      OPENAI_API_KEY: ${BAILIAN_API_KEY:-}
      OPENAI_BASE_URL: ${BAILIAN_BASE_URL:-}
      OPENAI_MODEL: ${BAILIAN_MODEL:-qwen3.8-flash}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-change-me}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      SEARXNG_BASE_URL: ${SEARXNG_URL:-http://searxng:8080}
      TOKENRANK_WEBHOOK: ${TOKENRANK_WEBHOOK:-}
      TOKENRANK_INTERVAL: ${TOKENRANK_INTERVAL:-1800}
      # 固定上报设备身份（见 opentoken/README.md）；留空则重建容器会生成新设备
      OPENTOKEN_DEVICE_ID: ${OPENCLAW_TOKEN_DEVICE_ID:-}
    ports: ["127.0.0.1:${OPENCLAW_PORT:-18789}:18789"]
    # opentoken 上报守护：二进制来自共享卷（只读），状态落进 openclaw-data 卷。
    command: ["sh", "-c", "/opt/opentoken/start.sh & exec node openclaw.mjs gateway"]
    volumes:
      - "openclaw-data:/home/node/.openclaw"
      - "opentoken-bin:/opt/opentoken:ro"
      - "${WORKSPACE_DIR:-/c/Users/77958/Projects/workspace}:/work"
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [stack-net]
  hermes:
    # 自建镜像：官方镜像 + Playwright/Chromium（见 docker/hermes.Dockerfile）
    build:
      context: ./docker
      dockerfile: hermes.Dockerfile
      args:
        BASE_IMAGE: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-https://cdn.playwright.dev}
    image: hermes-pw:latest
    restart: unless-stopped
    # opentoken 上报守护：必须以 hermes 用户（HOME=/opt/data）运行，否则扫不到用量数据。
    command:
      - "sh"
      - "-c"
      # 用 runuser 而非 su：hermes 账号在 /etc/shadow 里是锁定的（!），su 走 PAM
      # 会报 "Authentication failure"；runuser 是 root 专用降权，不查密码。
      # 注意：s6 的 main-wrapper 已经把 command 降权到 hermes 用户执行（实测 runuser 会
      # 报 "may not be used by non-root users"），所以这里不能再降权，只需显式给出
      # HOME=/opt/data —— opentoken 靠它定位 hermes 的用量数据（默认 HOME 扫不到）。
      - "setsid env HOME=/opt/data /opt/opentoken/start.sh >>/opt/data/.opentoken/start.log 2>&1 & exec /opt/hermes/docker/entrypoint-dispatch.sh gateway run"
    env_file: [.env]
    environment:
      OPENAI_API_KEY: ${BAILIAN_API_KEY:-}
      OPENAI_BASE_URL: ${BAILIAN_BASE_URL:-}
      OPENAI_MODEL: ${BAILIAN_MODEL:-qwen3.8-flash}
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-0}
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # Dashboard on a non-loopback bind REQUIRES an auth provider (the gateway
      # fails closed without one). Basic auth is the zero-infra option.
      # Leave these empty while HERMES_DASHBOARD=0 — they are then inert.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      # Bind the OpenAI-compatible API server to all interfaces so the published
      # port 8642 works behind Docker port-mapping (default is loopback-only,
      # which only works with network_mode: host). API_SERVER_KEY is mandatory
      # in hermes when the API server is not bound to localhost.
      API_SERVER_HOST: ${API_SERVER_HOST:-0.0.0.0}
      API_SERVER_KEY: ${API_SERVER_KEY:-}
      TOKENRANK_INTERVAL: ${TOKENRANK_INTERVAL:-1800}
      OPENTOKEN_DEVICE_ID: ${HERMES_TOKEN_DEVICE_ID:-}
    ports:
      - "127.0.0.1:${HERMES_GATEWAY_PORT:-8642}:8642"
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - "hermes-data:/opt/data"
      - "opentoken-bin:/opt/opentoken:ro"
      - "${WORKSPACE_DIR:-/c/Users/77958/Projects/workspace}:/work"
      # terminal.backend is "local": the gateway runs shell commands inside this
      # container, so no docker.sock mount is needed (and none should be granted —
      # it hands the container control over the host Docker daemon).
      # To re-enable sandboxed execution: set terminal.backend back to "docker" in
      # /opt/data/config.yaml AND restore:
      #   - "/var/run/docker.sock:/var/run/docker.sock"
    networks: [stack-net]
  dsh:
    image: dsh:${DSH_VERSION:-0.1.7-rc.2}
    build:
      context: ../../dsh
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.7-rc.2}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-https://cdn.playwright.dev}
    restart: unless-stopped
    env_file: [../../dsh/.env]
    ports:
      # host 3080 -> container 3081 (socat) -> 127.0.0.1:3080 (dsh web)
      - "127.0.0.1:${DSH_PORT:-3080}:3081"
    volumes:
      - "dsh-home:/home/node/.dsh"
      # opentoken (tokenrank 用量上报) 配置持久化
      - "opentoken-data:/home/node/.opentoken"
      # 浏览器冒烟脚本（dsh 的构建上下文里没有这个文件，直接挂进去）
      - "./docker/browser-smoke.js:/opt/browser-smoke.js:ro"
      - "${WORKSPACE_DIR:-/c/Users/77958/Projects/workspace}:/work"
    networks: [stack-net]

networks:
  stack-net:
    external: true
    name: stack-net
volumes:
  # 显式映射旧卷名，重命名项目后数据不丢
  # external: true = 卷在早期项目里已建好，Compose 只引用不接管
  #   · 好处：不再打印 "created for project ..." 警告；down -v 也不会误删
  #   · 注意：external 卷必须已存在，否则 up 会报 volume not found
  openclaw-data:
    external: true
    name: draftdesk-agents_openclaw-data
  hermes-data:
    external: true
    name: draftdesk-agents_hermes-data
  dsh-home:
    external: true
    name: dsh_dsh-home
  opentoken-data:
  # opentoken 二进制 + 启动脚本的共享只读卷（三个 agent 共用一份，已 chown 1000）
  # 刷新方法见 opentoken/README.md
  opentoken-bin:
    external: true
    name: agents_opentoken-bin
